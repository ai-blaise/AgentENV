apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentenv-scheduler
  labels:
    app.kubernetes.io/name: agentenv-scheduler
spec:
  # Safe above one only because the schedulers share the state they used to
  # each own privately: node capacity and liveness arrive on the Redis node
  # stream (`node_stream_enabled`), and bindings and paused-sandbox ownership
  # live in the Redis binding store (`redis_addr`). Without both, a second
  # replica schedules against its own partial view of the fleet.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentenv-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentenv-scheduler
    spec:
      serviceAccountName: agentenv-scheduler
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: scheduler
          image: agentenv-scheduler:latest
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /config/scheduler.json
            - -mode
            - replica
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            exec:
              command:
                - /grpc_health_probe
                - -addr=127.0.0.1:9090
                # The named service, not the overall one. ReadinessGate
                # publishes fitness only here and leaves the overall status
                # SERVING from process start so an unreachable Redis cannot
                # crash-loop the whole tier. Without this flag the probe reads
                # that always-SERVING status, every pod is Ready before its
                # registry has replayed, and the gate is inert -- which is
                # exactly what `replicas: 2` behind a round-robin client makes
                # load-bearing.
                - -service=scheduler.v1.Scheduler
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            # Deliberately the overall service: liveness asks whether the
            # process is alive, and gating it on fitness would restart every
            # replica at once for one Redis outage.
            exec:
              command:
                - /grpc_health_probe
                - -addr=127.0.0.1:9090
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: scheduler-config
              mountPath: /config/scheduler.json
              subPath: scheduler.json
              readOnly: true
      volumes:
        - name: scheduler-config
          configMap:
            name: scheduler-k8s-config
