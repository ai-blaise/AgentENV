syntax = "proto3";

package scheduler.v1;

option go_package = "agentenv/services/api/proto;schedulerv1";

service Scheduler {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc LookupNode(LookupNodeRequest) returns (LookupNodeResponse);
  rpc RecordAssignment(RecordAssignmentRequest) returns (RecordAssignmentResponse);
  rpc RecordAssignments(RecordAssignmentsRequest) returns (RecordAssignmentsResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportSandboxEvent(ReportSandboxEventRequest) returns (ReportSandboxEventResponse);
  rpc ListObservedNodes(ListObservedNodesRequest) returns (ListObservedNodesResponse);
  rpc ListP2pPeers(ListP2pPeersRequest) returns (ListP2pPeersResponse);
  rpc RecordP2pArtifact(RecordP2pArtifactRequest) returns (RecordP2pArtifactResponse);
  rpc ForgetP2pArtifact(ForgetP2pArtifactRequest) returns (ForgetP2pArtifactResponse);
  rpc LookupP2pArtifact(LookupP2pArtifactRequest) returns (LookupP2pArtifactResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);

  // Paused-sandbox mobility records.
  //
  // These live here rather than on each node because the claim protocol they
  // support is inherently cross-node: a destination takes a sandbox from an
  // origin, and two nodes cannot arbitrate through a store on one of their
  // disks. The scheduler is already the cluster-wide authority for which node
  // owns a sandbox, and already has a durable store behind it.
  rpc UpsertMobilityRecord(UpsertMobilityRecordRequest) returns (UpsertMobilityRecordResponse);
  rpc GetMobilityRecord(GetMobilityRecordRequest) returns (GetMobilityRecordResponse);
  rpc ListMobilityRecords(ListMobilityRecordsRequest) returns (ListMobilityRecordsResponse);
  rpc RemoveMobilityRecord(RemoveMobilityRecordRequest) returns (RemoveMobilityRecordResponse);
}

message Node {
  string node_id = 1;
  string endpoint = 2;
}

// ScheduleRequestHint carries structured information parsed from the incoming
// request so the scheduler can make a more informed placement decision. Only
// request types that benefit from scheduling hints are represented; other
// requests omit the hint entirely.
message ScheduleRequestHint {
  oneof kind {
    NewColdSandboxHint new_cold_sandbox = 1;
    NewSandboxHint new_sandbox = 2;
  }
}

// NewColdSandboxHint describes a POST /sandboxes-cold request.
message NewColdSandboxHint {
  uint32 cpu_count = 1;
  uint64 memory_mb = 2;
  // OCI image references involved in the cold start: the rootfs image plus any
  // attached-drive images.
  repeated string images = 3;
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 4;
}

// NewSandboxHint describes a POST /sandboxes request.
message NewSandboxHint {
  // Sandbox metadata key/value pairs parsed from the request body.
  map<string, string> metadata = 1;
}

message ScheduleRequest {
  reserved 1;  // formerly: string hint = 1
  ScheduleRequestHint hint = 2;
  // Nodes that already refused this sandbox. A node's own admission decision
  // is authoritative over the scheduler's stale capacity view, so a rejection
  // must steer the retry rather than be retried into the same node.
  repeated string exclude_node_ids = 3;
}

message ScheduleResponse {
  Node node = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message LookupNodeRequest {
  string sandbox_id = 1;
}

message LookupNodeResponse {
  Node node = 1;
}

message RecordAssignmentRequest {
  string sandbox_id = 1;
  Node node = 2;
}

message RecordAssignmentResponse {}

// RecordAssignmentsRequest records a batch of sandbox-to-node bindings in one
// call. Fork creates up to 100 children in a single response, and recording
// them one RPC at a time serializes that many round trips inside the caller's
// deadline.
message RecordAssignmentsRequest {
  repeated RecordAssignmentRequest assignments = 1;
}

// RecordAssignmentsResponse reports per-assignment outcomes positionally: entry
// i describes assignments[i]. A partially applied batch is normal — the caller
// logs the failures rather than failing the client request that produced them.
message RecordAssignmentsResponse {
  repeated RecordAssignmentResult results = 1;
}

message RecordAssignmentResult {
  string sandbox_id = 1;
  // Empty when the binding was recorded.
  string error = 2;
}

message MachineInfo {
  string cpu_family = 1;
  string cpu_model = 2;
  string cpu_model_name = 3;
  string cpu_architecture = 4;
  string cpu_config_json = 5;
  // Which backend the node builds sandboxes with: "firecracker" or "mock".
  // Absent (older nodes) means firecracker. A mock node runs no guests and
  // must be visible as such wherever nodes are listed.
  string sandbox_backend = 6;
}

message DiskMetric {
  string mount_point = 1;
  string device = 2;
  string filesystem_type = 3;
  uint64 used_bytes = 4;
  uint64 total_bytes = 5;
}

// NodeStatus describes the effective state of a node as derived by the
// scheduler from its discovery state and heartbeat history.
//
//   active  + heartbeat OK      → READY        — accepts new sandboxes
//   active  + no heartbeat      → CONNECTING    — discovered but not yet confirmed
//   active  + heartbeat timeout → UNHEALTHY     — heartbeat lost
//   lingering + heartbeat OK    → LINGERING     — terminating, draining existing work
//   lingering + no heartbeat    → CONNECTING    — terminating, never confirmed
//   lingering + heartbeat timeout → UNHEALTHY   — terminating, heartbeat lost
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_READY = 1;
  NODE_STATUS_CONNECTING = 2;
  NODE_STATUS_UNHEALTHY = 3;
  NODE_STATUS_LINGERING = 4;
}

message NodeSnapshot {
  NodeStatus status = 1;
  uint32 allocated_cpu = 2;
  uint64 allocated_memory_bytes = 3;
  uint32 cpu_percent = 4;
  uint32 cpu_count = 5;
  uint64 memory_used_bytes = 6;
  uint64 memory_total_bytes = 7;
  repeated DiskMetric disks = 8;
  uint32 sandbox_count = 9;
  uint32 sandbox_starting_count = 10;
  uint64 create_successes = 11;
  uint64 create_fails = 12;
  int64 reported_at_unix_ms = 13;
  // Paused-sandbox resource accounting. These are *not* included in
  // sandbox_count, allocated_cpu, or allocated_memory_bytes — those report the
  // active running set only. Paused sandboxes have released their VM-side
  // CPU / memory but still own persisted state on the node, so the scheduler
  // can use these fields (together with the active fields) to apply
  // "including paused" capacity limits.
  uint32 paused_sandbox_count = 14;
  uint32 paused_allocated_cpu = 15;
  uint64 paused_allocated_memory_bytes = 16;

  // Observed guest memory consumption, as opposed to the allocated ceiling
  // above. Field numbers 17-19 are allocated for this even though only a
  // placement change populates them, so no other change claims them.
  reserved 17, 18, 19;
}

message P2pEndpoint {
  string backend = 1;
  string address = 2;
}

message ObservedNode {
  string node_id = 1;
  string endpoint = 2;
  string cluster_id = 3;
  string service_instance_id = 4;
  string version = 5;
  string commit = 6;
  MachineInfo machine_info = 7;
  NodeSnapshot snapshot = 8;
  int64 last_seen_unix_ms = 9;
}

// HeartbeatRequest field registry. Field numbers 10-16 are allocated ahead of
// use so independent changes cannot claim the same number:
//
//   10  roster_complete         (allocated, defined below)
//   11  heartbeat_interval_ms   (allocated, defined below)
//   12  p2p_artifacts           (reserved for the P2P index re-announce)
//   13  roster_digest           (allocated, defined below)
//   14  roster_full             (allocated, defined below)
//   15  emitted_event_count     (allocated, defined below)
//   16  roster_generation       (reserved for the sequenced worker outbox)
//
// Observed-usage fields are allocated on NodeSnapshot (17-19), not here.
message HeartbeatRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  string version = 4;
  string commit = 5;
  MachineInfo machine_info = 6;
  NodeSnapshot snapshot = 7;
  repeated string sandbox_ids = 8;
  P2pEndpoint p2p_endpoint = 9;

  // Whether sandbox_ids is the node's complete roster. A node sets this only
  // once startup recovery has finished; until then the scheduler must not
  // treat an empty roster as "this node owns nothing" and delete its bindings.
  //
  // That is the only protection it gives. A non-empty roster is reconciled
  // whatever this says: bindings it omits are deleted once past the grace,
  // because nodes that predate this field never set it and their departed
  // sandboxes must still be reaped. A node still discovering what it holds
  // must send an empty roster, never a partial one.
  //
  // Absent (false) is the conservative reading, so an older node talking to a
  // newer scheduler never triggers the wipe.
  bool roster_complete = 10;

  // The node's configured heartbeat interval, so the scheduler can validate
  // that its own binding TTL is ordered correctly against it rather than
  // assuming a value. Zero means the node did not report one.
  uint64 heartbeat_interval_ms = 11;

  // A hash over the node's roster, sent on every heartbeat.
  //
  // The roster is almost always identical to the last one, and at fleet scale
  // resending and re-reconciling it dominates both the wire cost of a
  // heartbeat and the scheduler's work per heartbeat. The digest lets an
  // unchanged roster be recognised in one comparison.
  //
  // Empty means the node does not compute one, in which case sandbox_ids is
  // authoritative as before. It is never a substitute for the roster itself:
  // a scheduler that has no digest recorded for a node must still reconcile.
  string roster_digest = 13;

  // Whether sandbox_ids carries the roster this digest was computed over.
  //
  // False means the node elided it because the digest was unchanged. A
  // scheduler that cannot use the digest — it restarted, or it never saw this
  // node — asks for the roster back via HeartbeatResponse.request_full_roster
  // rather than guessing, because an elided roster and an empty one are
  // indistinguishable on the wire and mean opposite things.
  bool roster_full = 14;

  // How many sandbox lifecycle events this node has emitted since it started.
  //
  // Event delivery is best effort and fire-and-forget, so a dropped batch
  // skews the scheduler's short-term view of the node with nothing to say it
  // happened. Comparing this against what the scheduler received turns silent
  // loss into a number. It is not a sequence number and nothing is
  // retransmitted: the reservation ledger is reset by every heartbeat anyway,
  // so loss self-corrects within one interval — what was missing was any way
  // to know it was happening.
  //
  // Zero means the node does not report one.
  uint64 emitted_event_count = 15;

  reserved 12, 16;
}

message HeartbeatResponse {
  string cpu_config_json = 1;

  // Asks the node to include its full roster on the next heartbeat.
  //
  // Set whenever the scheduler cannot resolve the node's digest against
  // something it already holds, which is the case after a scheduler restart
  // and for a node it has not seen before. Without it a node that never
  // changes its roster would never resend it, and a restarted scheduler would
  // hold no bindings for that node indefinitely.
  bool request_full_roster = 2;

  // Whether this scheduler understands roster digests at all.
  //
  // A node must keep sending its full roster until it sees this, because an
  // older scheduler leaves it false and would otherwise read an elided roster
  // as an empty one and delete every binding for the node. `request_full_roster`
  // cannot carry that signal: false there means "no need", which is exactly
  // what an older scheduler also sends.
  bool roster_digest_accepted = 3;
}

enum SandboxEventType {
  SANDBOX_EVENT_TYPE_UNSPECIFIED = 0;
  SANDBOX_EVENT_TYPE_CREATE = 1;
  SANDBOX_EVENT_TYPE_DELETE = 2;
  SANDBOX_EVENT_TYPE_PAUSE = 3;
  SANDBOX_EVENT_TYPE_RESUME = 4;
  // Fork events are reported once per child sandbox; sandbox_id and requested
  // resources refer to the child sandbox, not the source sandbox.
  SANDBOX_EVENT_TYPE_FORK = 5;
}

message SandboxEvent {
  string sandbox_id = 1;
  SandboxEventType event_type = 2;
  uint32 requested_cpu = 3;
  uint64 requested_memory_bytes = 4;
  uint64 requested_disk_bytes = 5;
}

message ReportSandboxEventRequest {
  string node_id = 1;
  string cluster_id = 2;
  string service_instance_id = 3;
  repeated SandboxEvent events = 4;
}

message ReportSandboxEventResponse {}

message ListObservedNodesRequest {
  string cluster_id = 1;
}

message ListObservedNodesResponse {
  repeated ObservedNode nodes = 1;
}

message P2pPeer {
  string node_id = 1;
  P2pEndpoint endpoint = 2;
}

message ListP2pPeersRequest {
  string cluster_id = 1;
  string backend = 2;
  string exclude_node_id = 3;
}

message ListP2pPeersResponse {
  repeated P2pPeer peers = 1;
}

message RecordP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message RecordP2pArtifactResponse {}

message ForgetP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string node_id = 4;
}

message ForgetP2pArtifactResponse {}

message LookupP2pArtifactRequest {
  string cluster_id = 1;
  string backend = 2;
  string key = 3;
  string exclude_node_id = 4;
}

message LookupP2pArtifactResponse {
  repeated P2pPeer peers = 1;
}

message GetNodeRequest {
  string node_id = 1;
  string cluster_id = 2;
}

message GetNodeResponse {
  ObservedNode node = 1;
}

message UnregisterNodeRequest {
  string node_id = 1;
  string service_instance_id = 2;
}

message UnregisterNodeResponse {}

// Where a paused sandbox is in the process of being handed over.
enum MobilityState {
  MOBILITY_STATE_UNSPECIFIED = 0;
  // Held by its origin and available to move.
  MOBILITY_STATE_PARKED = 1;
  // A destination has announced it intends to take this sandbox. A claim is
  // an announcement, not a grant: it exists so the origin refuses a local
  // resume while a handover is in flight, and so a second destination can see
  // it is racing.
  MOBILITY_STATE_CLAIMED = 2;
  // The sandbox runs on another node now. Kept rather than deleted so a late
  // claim can be answered with "already gone, and to whom" instead of
  // "unknown sandbox", which is indistinguishable from a lost record.
  MOBILITY_STATE_EVACUATED = 3;
}

// What a destination needs to know before it can take a paused sandbox.
message MobilityRecord {
  string sandbox_id = 1;
  string origin_node_id = 2;

  // A total order over versions of this record, as a UUIDv7 in hyphenated
  // hex. A write with an older or equal generation is discarded rather than
  // applied, which is what stops a superseded actor resurrecting stale state.
  //
  // Sent as text because its string order is its numeric order — the 48-bit
  // timestamp leads, big-endian, and every value is the same length — so the
  // comparison can happen inside a Lua script without parsing.
  string generation = 3;

  // The runtime the paused guest was booted against, as opaque JSON.
  //
  // The scheduler never interprets or compares this; only a candidate node can
  // say whether it matches its own. Keeping it opaque means the fingerprint
  // can gain fields without a scheduler release, and it is the part of this
  // message most likely to grow.
  string fingerprint_json = 4;

  // Whether the artifacts backing this sandbox are readable off-node.
  string artifact_reach = 5;

  uint32 cpu_count = 6;
  uint32 memory_mib = 7;

  // The snapshot the paused state was committed under. Empty means the state
  // exists only as node-local files, so nothing can take it over yet — which
  // is the ordinary condition of a freshly paused sandbox.
  string snapshot_id = 8;

  int64 paused_at_unix_ms = 9;

  MobilityState state = 10;
  // Set for CLAIMED and EVACUATED: who holds it, or who took it.
  string holder_node_id = 11;
  int64 state_at_unix_ms = 12;
}

message UpsertMobilityRecordRequest {
  MobilityRecord record = 1;

  // Write only if the stored generation is exactly this.
  //
  // Empty means an unconditional write, ordered by generation alone — enough
  // for bookkeeping, not enough to arbitrate a claim. A claimant sends what it
  // read, so a rival that read the same state finds its expectation stale and
  // is told it lost. Generation ordering cannot do that on its own, because
  // the loser's generation is also newer than what it read.
  string expected_generation = 2;

  // Whether expected_generation means "no record must exist".
  //
  // Needed because the empty string cannot distinguish "expect nothing" from
  // "do not check", and those are opposite instructions.
  bool expect_absent = 3;
}

message UpsertMobilityRecordResponse {
  // False means a generation at least as new was already stored, so this
  // write was discarded. Not an error: a superseded actor writing late is the
  // ordinary shape of a handover race, and the caller should re-read.
  bool applied = 1;
}

message GetMobilityRecordRequest {
  string sandbox_id = 1;
}

message GetMobilityRecordResponse {
  MobilityRecord record = 1;
  bool found = 2;
}

message ListMobilityRecordsRequest {
  // Records held by this node. A node asks for its own; a drain asks for the
  // departing node's.
  string origin_node_id = 1;
}

message ListMobilityRecordsResponse {
  repeated MobilityRecord records = 1;
}

message RemoveMobilityRecordRequest {
  string sandbox_id = 1;
}

message RemoveMobilityRecordResponse {}
