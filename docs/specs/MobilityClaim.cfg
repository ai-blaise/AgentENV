\* Clock disagreement within what the constants absorb: the holder's abandon
\* margin plus the rival's resume grace.
CONSTANTS
    Origin = o
    Destinations = {d1, d2}
    TTL = 3
    AbandonMargin = 1
    ResumeGrace = 1
    MaxSkew = 2
    MaxTime = 8

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    AtMostOneLiveCopy
    OnlyTheHolderRuns

CHECK_DEADLOCK FALSE
