\* Clock disagreement beyond what the constants absorb: the checker should
\* find two live copies.
CONSTANTS
    Origin = o
    Destinations = {d1, d2}
    TTL = 3
    AbandonMargin = 1
    ResumeGrace = 1
    MaxSkew = 3
    MaxTime = 8

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    AtMostOneLiveCopy
    OnlyTheHolderRuns

CHECK_DEADLOCK FALSE
