[package]
name = "agentenv-control-plane"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "agentenv-control-plane"
path = "src/main.rs"

[dependencies]
agentenv-observability = { path = "../observability" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
metrics = "0.24"
parking_lot = "0.12"
prost = "0.14.3"
redis = { version = "1.6.0", default-features = false, features = [
    "connection-manager",
    "script",
    "tls-rustls-webpki-roots",
    "tokio-rustls-comp",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.2", features = ["tls-ring"] }
tonic-health = "0.14.2"
tonic-prost = "0.14.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[build-dependencies]
tonic-prost-build = "0.14.2"
